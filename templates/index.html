<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f1a" />
  <title>Gym Tracker · Gavin & Devin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body
  data-today="{{ today }}"
  data-goal="{{ weekly_goal }}"
  data-me='{"key":"{{ me.key }}","name":"{{ me.name }}","color":"{{ me.color }}"}'
  data-people='[{% for p in people %}{"key":"{{ p.key }}","name":"{{ p.name }}","color":"{{ p.color }}"}{% if not loop.last %},{% endif %}{% endfor %}]'
>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="brandMark"><img
        src="{{ url_for('static', filename='jumpscare.jpg') }}" alt=""
        onerror="this.remove(); this.parentElement.textContent='🏋️';"></span>
      <div>
        <h1>GYM&nbsp;TRACKER</h1>
        <p class="tagline">Log in. Log your lifts. Talk your talk.</p>
      </div>
    </div>

    <div class="userbar">
      <span class="me" style="--pc: {{ me.color }}"><span class="who-dot"></span>{{ me.name }}</span>
      <a class="logout" href="{{ url_for('logout') }}">Log out</a>
    </div>
  </header>

  <!-- Hype / trash-talk banner -->
  <div class="hype" id="hype"></div>

  <!-- This week -->
  <section class="week-panel" id="weekPanel">
    <div class="week-head">
      <h2>This week</h2>
      <span class="week-range" id="weekRange"></span>
    </div>
    <div class="week-cards" id="weekCards"></div>
  </section>

  <!-- Head-to-head arena -->
  <section class="h2h" id="h2h"></section>

  <main class="layout">
    <!-- Calendar -->
    <section class="cal-card">
      <div class="cal-head">
        <button class="nav-btn" id="prevMonth" aria-label="Previous month">‹</button>
        <h2 id="monthLabel"></h2>
        <button class="nav-btn" id="nextMonth" aria-label="Next month">›</button>
        <button class="today-btn" id="todayBtn">Today</button>
      </div>
      <div class="cal-dow">
        <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </section>

    <!-- Stats -->
    <aside class="stats-col" id="statsCol"></aside>
  </main>

  <!-- Consistency heatmap (GitHub-style) -->
  <section class="heat-card" id="heatCard"></section>

  <!-- Confetti canvas for goal celebrations -->
  <canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Jumpscare overlay (random) -->
  <div id="jumpscare" class="jumpscare" hidden aria-hidden="true">
    <img src="{{ url_for('static', filename='jumpscare.jpg') }}" alt="">
  </div>

  <!-- Day detail sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h3 id="sheetDate"></h3>
      <button class="sheet-close" id="sheetClose" aria-label="Close">✕</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
