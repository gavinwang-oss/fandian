<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gym Tracker</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="auth-body">
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="auth-card">
    <div class="auth-brand"><span class="brand-mark">🏋️</span><h1>GYM TRACKER</h1></div>
    <p class="auth-sub">Type your name to jump in. New name = new player. Same name = welcome back.</p>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
      <label>Your name
        <input name="name" value="{{ name }}" placeholder="e.g. Devin" autocomplete="off" autofocus required>
      </label>
      <button type="submit" class="auth-btn">Let's go →</button>
    </form>
    <p class="auth-alt">No passwords. It's just us. 💪</p>
  </div>
</body>
</html>
