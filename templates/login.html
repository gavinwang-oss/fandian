<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in · Gym Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="auth-body">
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="auth-card">
    <div class="auth-brand"><span class="brand-mark">🏋️</span><h1>GYM TRACKER</h1></div>
    <p class="auth-sub">Welcome back. Log your gym days, keep the streak.</p>
    {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}
    <form method="post" class="auth-form">
      <label>Username
        <input name="username" value="{{ username }}" autocomplete="username" autofocus required>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="auth-btn">Log in</button>
    </form>
    <p class="auth-alt">No account yet? <a href="{{ url_for('signup') }}">Create one →</a></p>
  </div>
</body>
</html>
