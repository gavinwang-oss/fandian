# Render Blueprint — deploys the gym tracker on the free tier.
# In the Render dashboard: New → Blueprint, pick this repo, and it creates
# both services below. The web service is wired to the free Postgres DB via
# DATABASE_URL automatically, so workouts persist across redeploys.
services:
  - type: web
    name: gym-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: gym-tracker-db
          property: connectionString

databases:
  - name: gym-tracker-db
    plan: free
